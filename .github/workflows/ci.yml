name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Install frontend dependencies
        run: npm ci
      - name: Verify synchronized application versions
        run: |
          npm run sync:version
          git diff --exit-code -- package.json package-lock.json src-tauri/tauri.conf.json src-tauri/Cargo.toml src-tauri/Cargo.lock
      - name: Test frontend domain logic
        run: npm test
      - name: Build frontend
        run: npm run build
      - name: Check Rust formatting
        working-directory: src-tauri
        run: cargo fmt --check
      - name: Lint Rust
        working-directory: src-tauri
        run: cargo clippy --all-targets --all-features -- -D warnings
